{{ define "main" }}
  <div class="hx:mx-auto hx:flex hextra-max-page-width">
    {{ partial "sidebar.html" (dict "context" . "disableSidebar" true "displayPlaceholder" false) }}
    <article class="hx:w-full hx:break-words hx:flex hx:min-w-0 hx:justify-center hx:pb-8 hx:pr-[calc(env(safe-area-inset-right)-1.5rem)]">
      <main id="content" class="cci-wrap cci-404 hx:w-full">
        <h1>Page not found</h1>
        <p>This page does not exist, or it moved. Go to the <a href="{{ "index.html" | relURL }}">home page</a> or the <a href="{{ "docs/index.html" | relURL }}">documentation</a>, or press <kbd>Ctrl</kbd> <kbd>K</kbd> to search.</p>
      </main>
    </article>
  </div>
{{ end }}
