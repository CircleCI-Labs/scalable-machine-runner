# Optional classes: linux-java (an image swap) and linux-hardened (jobs have no sudo). Deploy with an extra -c flag:
#   docker stack deploy -c linux/stack/runners.yaml -c linux/stack/classes-extra.yaml runners
# Create the secrets first (same format as in runners.yaml): linux-java-token and linux-hardened-token, one resource class each
# (<namespace>/linux-java and <namespace>/linux-hardened). Delete a class from your copy of this file, with its secret, network and
# proxy entries, if you want only the other one. Like the class of runners.yaml, these classes claim through the token-proxy of
# runners.yaml (the service below only adds them to it), so deploy the two files together. The runners hold the placeholder secret
# runner-placeholder-token.
#
#   linux-java      cimg/openjdk:21.0, jobs keep passwordless sudo, like linux-default
#   linux-hardened  jobs have NO sudo and cannot become root in their container: the step-down is setpriv --no-new-privs, which the job and
#                   everything it starts inherits, so even the setuid sudo of the image cannot raise it. Tools must be in the image
#                   (docs/images.md). With the token proxy the runner holds no real token either way; this class keeps jobs from
#                   touching the runner's files and processes.
#
# This file repeats the anchors of runners.yaml (an anchor does not reach into another file): keep the common settings in sync.

x-env: &env
  CIRCLECI_RUNNER_MODE: single-task
  CIRCLECI_RUNNER_IDLE_TIMEOUT: 1h   # an idle slot is replaced, so it picks up a rotated secret or a new image
  CIRCLECI_RUNNER_CLEANUP_WORK_DIR: "false"   # the container is discarded after the job, and the runner (uid 2000) cannot remove job-owned files
  CIRCLECI_RUNNER_LOGGING_FORMAT: text
  CIRCLECI_RUNNER_API_URL: http://token-proxy:8080   # the runner and its task agent call the API through the token proxy
  # CIRCLECI_RUNNER_MAX_RUN_TIME: 2h   # default 5h; keep stop_grace_period at this plus 5m
  # HTTPS_PROXY: http://proxy.example.com:3128   # jobs inherit variables set here; also set it on token-proxy, and add NO_PROXY: token-proxy here

x-restart: &restart
  condition: any   # every exit (job done, idle timeout, crash) starts a new container
  delay: 10s       # also the pause between retries after a configuration error (exit 80)

x-update: &update
  order: stop-first   # a busy replica drains (finishes its job) before it is replaced
  parallelism: 1

x-placement: &placement
  constraints:
    - node.platform.os == linux
    # Never on a Docker-build node (docker-build.yaml): a job there reaches the engine and can read what other tasks on the node hold.
    # A node without the label matches: Swarm reads a missing label as not equal.
    - node.labels.machine-runner-swarm.docker-build != true
    # Never on a microVM node (microvm.yaml): Docker's DNS does not work in a Kata VM, so a job would have none.
    - node.labels.machine-runner-swarm.microvm != true
    # - node.platform.arch == x86_64                # or aarch64
    # - node.labels.machine-runner-swarm.zone == <network zone>      # docker node update --label-add machine-runner-swarm.zone=<zone> <node>
  preferences:
    - spread: node.id

# A class of another stack file needs the same five keys: the entrypoint and its config, user "0", the placeholder secret, and the volume.
x-runner: &runner
  user: "0"   # the entrypoint starts as root, then runs the runner as uid 2000
  entrypoint: ["/circleci-runner-entrypoint"]
  configs:
    - {source: entrypoint, target: /circleci-runner-entrypoint, mode: 0555}
  secrets:
    - source: runner-placeholder-token   # made up: the real token is in token-proxy only
      target: circleci_runner_config.yaml
      uid: "2000"
      gid: "2000"
      mode: 0400
  init: true   # SIGTERM reaches the runner, which drains; stop_grace_period lets a running job finish
  stop_grace_period: 5h5m   # the runner's max_run_time (5h) plus 5 minutes
  ulimits:
    nofile: {soft: 65536, hard: 65536}
    core: 0
  logging:
    driver: local
    options: {max-size: 20m, max-file: "3"}
  volumes:
    # The runner of this node, filled by runner-distributor. The entrypoint resolves the link current once, when the container starts, so
    # a new runner version reaches the next container (the next job) only, and running jobs finish on the old one.
    - {type: volume, source: runner-bin, target: /opt/machine-runner-swarm, read_only: true}

services:
  # Adds the classes to the token proxy of runners.yaml: the proxy serves a class for every secret <service>-token that it holds, so a
  # class needs its secret and its network there, and nothing else (stack files merge networks and secrets by name).
  token-proxy:
    secrets:
      - {source: linux-java-token, target: linux-java-token, uid: "65534", gid: "65534", mode: 0400}
      - {source: linux-hardened-token, target: linux-hardened-token, uid: "65534", gid: "65534", mode: 0400}
    networks: [linux-java, linux-hardened]

  linux-java:
    <<: *runner
    image: cimg/openjdk:21.0
    hostname: "{{.Node.Hostname}}-linux-java-{{.Task.Slot}}"
    environment:
      <<: *env
      CIRCLECI_RUNNER_NAME: "{{.Node.Hostname}}-linux-java-{{.Task.Slot}}"
      MACHINE_RUNNER_SWARM_JOB_SUDO: "true"
    networks: [linux-java]
    cap_drop: [NET_RAW, MKNOD]
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *update
      resources:
        limits: {cpus: "4", memory: 8G, pids: 4096}
        reservations: {cpus: "4", memory: 8G}
      placement: *placement

  linux-hardened:
    <<: *runner
    image: cimg/base:2026.10
    hostname: "{{.Node.Hostname}}-linux-hardened-{{.Task.Slot}}"
    environment:
      <<: *env
      CIRCLECI_RUNNER_NAME: "{{.Node.Hostname}}-linux-hardened-{{.Task.Slot}}"
      MACHINE_RUNNER_SWARM_JOB_SUDO: "false"
    networks: [linux-hardened]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, KILL, AUDIT_WRITE]   # entrypoint (chown and chmod), the setpriv step-down, docker-init signalling the runner
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *update
      resources:
        limits: {cpus: "2", memory: 4G, pids: 4096}
        reservations: {cpus: "2", memory: 4G}
      placement: *placement

networks:
  # One overlay per class, as in runners.yaml.
  linux-java: {driver: overlay}
  linux-hardened: {driver: overlay}

secrets:
  runner-placeholder-token: {external: true}   # every runner: a made-up token (runners.yaml)
  linux-java-token: {external: true}   # the class tokens: token-proxy only
  linux-hardened-token: {external: true}

configs:
  # As in runners.yaml (ci/config-names.sh keeps the name in step with the file), so that this file also loads alone.
  entrypoint: {name: machine-runner-swarm-entrypoint-219dd9e6972a, file: circleci-runner-entrypoint}

volumes:
  runner-bin: {}   # the volume that runner-distributor fills (runners.yaml)
