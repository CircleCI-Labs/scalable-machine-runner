# Example: building a Docker image on the opt-in linux-docker-build class ("pattern A").
#
# The service (linux/stack/docker-build.yaml) bind-mounts the HOST Docker socket, which is root-equivalent on that node: any job on
# this class can control the host's Docker engine (start privileged containers, read the host's
# files, read other jobs' data). Use a dedicated worker node labelled smr.docker-build=true, give
# the class to trusted projects only (config policy), and keep production contexts off it.
# Alternatives that do not hand out the engine: a rootless BuildKit daemon on the host (mount only its
# socket), or daemonless builds with Kaniko or Buildah inside an ordinary job.
version: 2.1

jobs:
  image:
    machine: true
    resource_class: my-namespace/linux-docker-build
    steps:
      - checkout
      - run:
          name: Build the image with the host engine
          command: |
            docker build -t "app:${CIRCLE_SHA1:0:12}" .
            docker image ls "app:${CIRCLE_SHA1:0:12}"
      - run:
          name: Clean up, the engine outlives the job
          when: always
          command: docker image rm -f "app:${CIRCLE_SHA1:0:12}" || true

workflows:
  build-image:
    jobs:
      - image
