# Example: a job on a resource class backed by your own image, built like windows/images/example/Dockerfile
# (stock Server Core plus Node.js): the "windows-custom" service in windows/stack/custom-image.yaml.
# Whatever your image adds is there at the start of every job, and every job still gets a brand-new container.
# Replace <NAMESPACE>. The tool here is Node.js; use whatever your team adds to its image.
version: 2.1

jobs:
  test-with-the-image-tooling:
    machine: true
    resource_class: <NAMESPACE>/windows-custom
    steps:
      - checkout
      - run:
          name: The tools the image provides
          command: |
            node --version
            npm --version
            git --version
      - run:
          name: Install and test
          command: |
            npm ci
            npm test

workflows:
  custom-image:
    jobs:
      - test-with-the-image-tooling
