# hadolint configuration for every Dockerfile in this repository.
# CI runs: hadolint --config .hadolint.yaml <each Dockerfile under linux/, windows/ and proxy/>
#
# Policy:
# - Warnings fail the build; info/style findings are reported only.
# - Base images must come from the registries below. Add a registry here only
#   after reviewing it; a customer mirror (Artifactory etc.) belongs in the
#   customer's own fork, not in this list.
# - Prefer an inline "# hadolint ignore=DLxxxx" with a reason over a global
#   ignore, so each exception is reviewed where it lives.
failure-threshold: warning

trustedRegistries:
  - docker.io                    # circleci/runner-agent, cimg/*
  - registry.access.redhat.com   # ubi9
  - mcr.microsoft.com            # windows/servercore, windows/nanoserver, powershell
  - gcr.io                       # distroless static, the base of the token proxy image (proxy/Dockerfile)

# No global ignores. hadolint already skips the POSIX shell rules (DL4006,
# shellcheck) for a Windows Dockerfile that sets SHELL ["powershell", ...].
ignored: []
