# yamllint configuration. CI runs: yamllint --strict .
# --strict makes warnings fail too, so anything that should only warn is
# disabled here instead of being left at "warning".
extends: default

ignore: |
  .git/

rules:
  line-length:
    max: 160
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  # Compose and CircleCI files are not multi-document streams.
  document-start: disable
  # `on:` / `yes` / `no` keys are not used, but values must be true/false.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  # Long inline JSON / flow mappings in CircleCI parameters.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
