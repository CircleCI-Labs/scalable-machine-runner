# Example CircleCI config for jobs that run on Windows runner containers from this repo
# (windows/stack/runners.yaml, service "windows-default", resource class <namespace>/windows-default).
#
# Every job gets a brand-new Windows Server Core container: Swarm replaces the container after each
# job, so nothing a job leaves in the profile, TEMP, the registry or C:\ProgramData reaches the next one.
# Replace <namespace> with your runner namespace.
#
# Headless only: no desktop or UI automation, no Docker commands (see windows-docker-build.yml), no
# service containers. Jobs run as ContainerAdministrator.
#
# Steps run in Git Bash ("bash -eo pipefail") unless a "shell:" key says otherwise; Git for Windows is
# on PATH, and so are Windows PowerShell 5.1 and cmd.
version: 2.1

jobs:
  build-and-test:
    machine: true
    resource_class: <namespace>/windows-default
    steps:
      - checkout
      - run:
          name: Bash step (the default shell)
          command: |
            echo "container $COMPUTERNAME, instance $SMR_INSTANCE_ID, runner $CIRCLECI_RUNNER_NAME"
            git --version
            uname -a
      - run:
          name: PowerShell step
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $PSVersionTable.PSVersion
            [Environment]::OSVersion.VersionString
      - run:
          name: cmd step
          shell: cmd.exe
          command: ver
      - run:
          name: Write test results
          command: |
            mkdir -p test-results/example
            printf '%s\n' '<testsuite name="example" tests="1"><testcase classname="example" name="passes"/></testsuite>' \
              > test-results/example/results.xml
      - store_test_results:
          path: test-results
      - persist_to_workspace:   # needs Git's tar and gzip, mounted into every runner and on PATH
          root: .
          paths:
            - test-results

  consume-workspace:
    machine: true
    resource_class: <namespace>/windows-default
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - attach_workspace:
          at: C:\cci\w\ws
      - run: Get-ChildItem -Recurse C:\cci\w\ws

  # windows-persistent (windows/stack/persistent.yaml): a long-lived runner that keeps C:\cache between jobs
  # (continuous mode). Only for a trusted resource class; a job can leave anything behind for the next one.
  warm-cache:
    machine: true
    resource_class: <namespace>/windows-persistent
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Use the persistent cache directory
          command: |
            $env:NUGET_PACKAGES = 'C:\cache\nuget'
            New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES | Out-Null
            Get-ChildItem C:\cache

workflows:
  windows-runner:
    jobs:
      - build-and-test
      - consume-workspace:
          requires: [build-and-test]
