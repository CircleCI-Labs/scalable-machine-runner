{{- /* The logo of CircleCI (assets of the brand guidelines, unchanged), the Labs tag, and the name of the project. */ -}}
<a class="cci-brand" href="{{ site.Home.RelPermalink }}" aria-label="CircleCI Labs, {{ site.Title }}">
  <img class="cci-brand-logo cci-show-light" src="{{ "images/circleci-logo.svg" | relURL }}" alt="CircleCI" width="117" height="28" />
  <img class="cci-brand-logo cci-show-dark" src="{{ "images/circleci-logo-white.svg" | relURL }}" alt="CircleCI" width="117" height="28" />
  <span class="cci-tag">Labs</span>
  <span class="cci-brand-name">{{ site.Title }}</span>
</a>
