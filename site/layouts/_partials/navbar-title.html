{{- /* The icon of the CircleCI-Labs organization (not the logo of CircleCI), the name of the organization, and the name of the project. */ -}}
<a class="cci-brand" href="{{ site.Home.RelPermalink }}" aria-label="CircleCI Labs, {{ site.Title }}">
  <img class="cci-brand-icon" src="{{ "images/circleci-labs-icon.png" | relURL }}" alt="" width="32" height="32" />
  <span class="cci-brand-org">CircleCI Labs</span>
  <span class="cci-brand-sep" aria-hidden="true">/</span>
  <span class="cci-brand-name">{{ site.Title }}</span>
</a>
