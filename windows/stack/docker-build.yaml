# Optional class: Windows image builds with the HOST Docker engine ("pattern A"). Deploy with an extra -c flag:
#   docker stack deploy -c windows\stack\runners.yaml -c windows\stack\docker-build.yaml runners
# Create the secret first (the runner config with the token, as in runners.yaml): windows-docker-build-token.
# It only schedules on nodes you label:  docker node update --label-add machine-runner-swarm.docker-build=true <node>
#
# !!! The engine's named pipe is ADMINISTRATOR-EQUIVALENT on its node: see the comment on the service.
#
# This file repeats the anchors of runners.yaml (an anchor does not reach into another file): keep the common
# settings in sync.

x-runner-env: &runner-env
  CIRCLECI_RUNNER_MODE: single-task
  CIRCLECI_RUNNER_CLEANUP_WORK_DIR: "true"
  CIRCLECI_RUNNER_LOGGING_FORMAT: text
  CIRCLECI_RUNNER_WORK_DIR: 'C:\cci\w'
  CIRCLECI_RUNNER_TASK_AGENT_DIRECTORY: 'C:\cci\agent'
  # CIRCLECI_RUNNER_MAX_RUN_TIME: 5h        # default 5h; keep stop_grace_period at least 5 minutes longer
  # HTTPS_PROXY / NO_PROXY: set here when the host needs a proxy (jobs inherit the runner's environment)
  MACHINE_RUNNER_SWARM_INSTANCE_ID: "{{.Task.ID}}"           # lets a job tell which container it ran in
  # Git for Windows ships Git Credential Manager; nothing in a container can answer its prompts.
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never
  GIT_CONFIG_COUNT: "1"                     # the system gitconfig is in the read-only Git tree
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

# The stock image's PATH is replaced, so it is spelled out: Windows first (its find, sort and tar stay
# ahead of Git's), then Git's cmd, ucrt64\bin and usr\bin (bash, sh, tar, gzip, ssh). Tests\Test-Injection.ps1
# checks the Windows part against the image's own PATH.
x-stock-env: &stock-env
  # yamllint disable-line rule:line-length
  PATH: 'C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;C:\Windows\System32\OpenSSH\;C:\Program Files\Git\cmd;C:\Program Files\Git\ucrt64\bin;C:\Program Files\Git\usr\bin'

x-runner-deploy: &runner-deploy
  endpoint_mode: dnsrr                      # no VIP: nothing connects to a runner
  restart_policy:
    condition: any                          # every exit (job done, idle timeout, exit 80) -> a NEW container
    delay: 10s                              # also the pause between attempts when the runner exits 80
  update_config:
    order: stop-first
    parallelism: 1
    failure_action: pause

x-runner: &runner
  isolation: process                        # the image build must match the host (machine-runner-swarm.windows-build label)
  stop_grace_period: 5h5m                   # runner max_run_time (5h) plus 5 minutes to drain
  logging:
    driver: json-file                       # rotation; "local" also works on Windows
    options:
      max-size: 20m
      max-file: "3"
  labels:
    machine-runner-swarm.role: runner

# Stock images: the runner is the main process. (The baked image has this as its ENTRYPOINT.)
x-stock: &stock
  entrypoint: ['C:\machine-runner-swarm\bin\circleci-runner.exe', machine, '--config', 'C:\ProgramData\Docker\secrets\circleci_runner_config.yaml']

x-runner-mount: &runner-mount                     # the runner, read-only
  type: bind
  source: '${MACHINE_RUNNER_SWARM_DIR:-C:\machine-runner-swarm}'              # to roll out a new runner or Git: stage C:\machine-runner-swarm-<version> and
  target: 'C:\machine-runner-swarm'                          # deploy with $env:MACHINE_RUNNER_SWARM_DIR='C:\machine-runner-swarm-<version>' (rolling update)
  read_only: true

x-git-mount: &git-mount                     # portable Git, where the task agent expects it
  type: bind
  source: '${MACHINE_RUNNER_SWARM_DIR:-C:\machine-runner-swarm}\git'
  target: 'C:\Program Files\Git'
  read_only: true

services:
  # Pattern A: Docker builds for WINDOWS images only. The job talks to the host engine through its
  # named pipe, so a job can do anything the engine can: it is administrator-equivalent on that node
  # (and on a Swarm manager it can also read every secret). Only nodes labelled machine-runner-swarm.docker-build=true
  # may run it, and no other class should share those nodes. Linux images cannot be built here.
  # docker.exe comes from the host: adjust the source to where it lives on your nodes.
  windows-docker-build:
    <<: [*runner, *stock]
    image: mcr.microsoft.com/windows/servercore:ltsc2022   # better: your windows\images\stop-timeout build of it (see runners.yaml)
    environment:
      <<: [*runner-env, *stock-env]
      CIRCLECI_RUNNER_NAME: "{{.Node.Hostname}}-windows-docker-build-{{.Task.Slot}}"
      CIRCLECI_RUNNER_IDLE_TIMEOUT: 1h
      # yamllint disable-line rule:line-length
      PATH: 'C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;C:\Windows\System32\OpenSSH\;C:\Program Files\Git\cmd;C:\Program Files\Git\ucrt64\bin;C:\Program Files\Git\usr\bin;C:\docker'
    volumes:
      - *runner-mount
      - *git-mount
      - type: bind
        source: 'C:\Program Files\Docker'
        target: 'C:\docker'
        read_only: true
      - type: npipe
        source: '\\.\pipe\docker_engine'
        target: '\\.\pipe\docker_engine'
    secrets:
      - source: windows-docker-build-token
        target: circleci_runner_config.yaml
    deploy:
      <<: *runner-deploy
      replicas: 1
      resources:
        limits: {cpus: "2", memory: 4g}
        reservations: {cpus: "2", memory: 4g}
      placement:
        constraints:
          - node.platform.os == windows
          - node.labels.machine-runner-swarm.windows-build == ltsc2022
          - node.labels.machine-runner-swarm.docker-build == true

secrets:
  windows-docker-build-token:
    external: true
