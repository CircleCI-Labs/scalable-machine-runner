# DRAFT, the new default: no host install. A global service, runner-distributor, keeps the pinned runner on every Linux node,
# including nodes that join later, in the per-node volume runner-bin. Deploy it with the base stack, and nothing is installed by hand:
#
#   docker stack deploy -c linux/stack/runners.yaml -c linux/stack/distributor.yaml runners
#
# The distributor (a stock Alpine image, the script is a Swarm config) downloads the runner, checks its SHA-256 against the pin below,
# writes versions/<version>/bin/circleci-runner into the volume and moves the link current to it with one atomic rename. The runner
# services mount the volume read-only. Their entrypoint is a Swarm config too (not a file of the volume, so a job that rewrites the
# volume cannot replace the check), waits until current points to the pinned version, resolves the link once, and exits 80 unless
# the binary matches the pin. Upgrade or roll back: change the three pins and run docker stack deploy again; docs/operations.md.
#
# The pin is the SHA-256 of the circleci-runner BINARY, not of the tarball that checksums.txt lists:
#   curl -fsSL https://circleci-binary-releases.s3.amazonaws.com/circleci-runner/<version>/circleci-runner_linux_<arch>.tar.gz | tar -xzO circleci-runner | sha256sum
# Swarm configs are immutable: when a file below changes, change the number at the end of its name, then deploy.

x-pin: &pin   # also read from the environment of docker stack deploy
  MACHINE_RUNNER_SWARM_RUNNER_VERSION: ${MACHINE_RUNNER_SWARM_RUNNER_VERSION:-3.1.12}
  MACHINE_RUNNER_SWARM_RUNNER_SHA256_AMD64: ${MACHINE_RUNNER_SWARM_RUNNER_SHA256_AMD64:-b981e27ad5d3cc80ecd3cb2b6c4801024d226d1b36961d88c0f7e13ecc1d0f81}
  MACHINE_RUNNER_SWARM_RUNNER_SHA256_ARM64: ${MACHINE_RUNNER_SWARM_RUNNER_SHA256_ARM64:-1ce7e55f98b06fbd1a9891f2c6d846cb9c9b234ef13a49978acde81466955238}

# Replaces the host bind and the entrypoint of every class of runners.yaml (the entries merge by name and by mount point). A class
# of another stack file needs the same four keys.
x-runner: &runner
  entrypoint: ["/circleci-runner-entrypoint"]
  configs:
    - {source: entrypoint, target: /circleci-runner-entrypoint, mode: 0555}
  environment: *pin
  volumes:
    - {type: volume, source: runner-bin, target: /opt/machine-runner-swarm, read_only: true}

services:
  linux-default: *runner
  linux-java: *runner
  linux-hardened: *runner

  runner-distributor:
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6   # stock; pin the digest you trust
    command: ["sh", "/runner-distributor.sh"]
    init: true   # SIGTERM reaches the script, which exits at once
    read_only: true
    hostname: "{{.Node.Hostname}}-runner-distributor"
    environment: *pin
    configs:
      - {source: distributor, target: /runner-distributor.sh, mode: 0444}
    volumes:
      - {type: volume, source: runner-bin, target: /opt/machine-runner-swarm}
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
    deploy:
      mode: global   # one per node, also on nodes that join later
      restart_policy: {condition: on-failure, delay: 30s}   # a failed download or a SHA-256 mismatch is retried; the runners wait or exit 80
      update_config: {order: stop-first, parallelism: 0}   # all nodes at once: runners wait for their node's flip
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 64}
      placement:
        constraints:
          - node.platform.os == linux

configs:
  entrypoint: {name: machine-runner-swarm-entrypoint-1, file: ../entrypoint/circleci-runner-entrypoint}
  distributor: {name: machine-runner-swarm-distributor-1, file: ../runner-distributor.sh}

volumes:
  runner-bin: {}   # one per node: the runner of that node
