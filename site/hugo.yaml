# Hugo configuration of the docs site (docs/ci.md, "Docs site"). Run site/stage.sh first: it writes content/.
#
# The GitHub Pages URL uses the repository name (machine-runner-swarm).
# baseURL and the GitHub menu link below must match that name. GitHub redirects repository URLs after a rename,
# but not the old Pages path. stage.sh derives blob/tree links from the GitHub menu URL.
baseURL: https://circleci-labs.github.io/machine-runner-swarm/
title: Machine runner swarm
locale: en-US
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term

module:
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    # Required by the theme (dark mode of code blocks).
    noClasses: false

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: security
      name: Security
      pageRef: /docs/security
      weight: 2
    - identifier: faq
      name: FAQ
      pageRef: /docs/faq
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Theme
      weight: 5
      params:
        type: theme-toggle
    - name: GitHub
      weight: 6
      url: https://github.com/CircleCI-Labs/machine-runner-swarm
      params:
        icon: github
    # Styled as the call to action of the header (assets/css/custom.css).
    - identifier: get-started
      name: Get started
      pageRef: /docs/get-started
      weight: 7

params:
  description: Self-hosted CircleCI runners with a clean container or microVM for every job, on Docker Swarm, for Linux and Windows Server.
  externalLinkDecoration: false
  repo: https://github.com/CircleCI-Labs/machine-runner-swarm

  # The landing page (layouts/home.html). "Who it is for" and "What is tested" come from README.md; the rest is in the template.
  home:
    title: Machine runner swarm
    tagline: A clean container for every job, on the Docker hosts you already run
    notice: >-
      Not an official CircleCI product and not supported by CircleCI Support.
      Pre-release 0.x: a minor release can change stack files. Field engineers maintain it on a best-effort basis.
    lead: >-
      Self-hosted CircleCI machine runner 3 on Docker Swarm, for Linux and Windows Server, with Kata microVMs for VM-grade isolation.
      No Kubernetes. Releases are signed.
    features:
      - icon: box
        title: A clean container for every job
        text: A runner claims one job and exits, and Swarm starts a new container. No job inherits files from the last one.
        link: docs/get-started/concepts/#what-a-clean-environment-covers
        linkText: What a clean environment covers
      - icon: cpu
        title: MicroVMs for VM-grade isolation
        text: Kata Containers classes run each job in its own microVM, with its own kernel, on Swarm. Experimental.
        link: docs/configure/microvm/
        linkText: MicroVM jobs
      - icon: server
        title: Linux and Windows in one cluster
        text: Linux amd64 and arm64, and Windows Server 2022 and 2025. Labels decide where each class runs.
        link: docs/install/multi-node/
        linkText: Multi-node clusters
      - icon: shield-check
        title: Jobs never see the class token
        text: A token proxy holds the token, and the runners hold a placeholder. A hardened class removes sudo.
        link: docs/get-started/concepts/#the-token-proxy
        linkText: The token proxy
      - icon: refresh-cw
        title: Runners that install and update themselves
        text: A distributor service installs the runner on every node, pins a tested version, and checks its SHA-256. Nothing to install on the hosts.
        link: docs/get-started/concepts/#the-runner-distributor-on-linux
        linkText: The runner distributor
      - icon: layers
        title: Scale by setting replicas
        text: A Swarm service is a resource class, and deploy.replicas sets how many jobs it runs at once.
        link: docs/get-started/concepts/#services-are-resource-classes
        linkText: How a class maps to a service

  banner:
    # The banner cannot be dismissed: custom.css hides the close button, and custom/banner.html renders the text.
    # A new key shows the banner again to visitors who closed an old one.
    key: labs-disclaimer-pre-1-0
    message: >-
      **CircleCI Labs project, pre-1.0.** Not an official CircleCI product and not supported by CircleCI Support.
      These pages track main. Each release bundle includes the docs for that release.

  navbar:
    displayTitle: true
    displayLogo: false
    width: normal

  theme:
    default: system
    # The toggle is in the header (menu item of type theme-toggle), not in the sidebar.
    displayToggle: false

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  # The Mermaid script is downloaded at build time and served from the site. Pinned to the version that the
  # lint-docs-mermaid job validates the diagrams with (minlag/mermaid-cli 12.0.1 bundles mermaid 12.0.0).
  mermaid:
    base: https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist

  highlight:
    copy:
      enable: true
      display: always

  page:
    width: normal
    contextMenu:
      enable: false

  toc:
    displayTags: false
