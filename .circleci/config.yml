version: 2.1

# Setup phase for CircleCI-Labs/scalable-machine-runner (see docs/ci.md).
#
# One small job decides what this pipeline runs and then continues the
# pipeline with .circleci/continue.yml, which holds ONE workflow (`ci`). The
# parameters below switch jobs in and out of that workflow with expression
# filters, so a skipped job is never scheduled:
#
#   full-suite   main, smr-swarm/*, or `full: true` (pipeline parameter, for a
#                manual run through the API) adds the Windows Server 2025 jobs and
#                makes the branch eligible for e2e.
#   e2e-linux    full-suite AND E2E_RUNNER_TOKEN_LINUX is non-empty
#   e2e-windows  full-suite AND E2E_RUNNER_TOKEN_WINDOWS is non-empty
#   release      the branch is main AND both e2e flags are true. The release job then
#                waits for every other job of the same workflow (docs/releasing.md).
#                It implies the three flags above, so the release never runs without
#                the full suite and both e2e groups.
#
# A tag pipeline (the release creates the tag) runs nothing and cannot release: CircleCI
# does not run a job for a tag unless the job has a tag filter, and neither this setup
# job nor any job of continue.yml has one. The pipeline ends as "no workflow", so the
# setup job never reaches the continuation call (and has nothing to end).
#
# Why the gate lives here and not in a job that calls `circleci-agent step halt`:
# the e2e probe jobs target a self-hosted runner class. Once a workflow
# schedules them, they queue until a runner claims them, which takes days
# when no runner exists. Halting a guard job ends only that job, so the probes
# would still queue. The decision therefore has to be made before the e2e
# workflow is compiled. Without the context, or without its secrets, the
# pipeline still runs lint, builds and local tests, and stays green.
setup: true

parameters:
  full:
    type: boolean
    default: false
    description: >
      Run the full suite (the Windows Server 2025 jobs and both e2e workflows when
      their tokens exist) on any branch. Not used by a schedule: there is none.

jobs:
  setup:
    docker:
      - image: cimg/base:2026.10@sha256:64becfab2860932391d834a770033665874e287a655dbef26e38df060414a79a
    resource_class: small
    steps:
      - checkout
      - run:
          name: Decide which suites run (e2e only when the context tokens are present)
          command: |
            mkdir -p /tmp/setup
            full=false
            reason="branch ${CIRCLE_BRANCH:-<none>} runs lint, builds and local tests only"
            case "${CIRCLE_BRANCH:-}" in
              main) full=true; reason="main" ;;
              smr-swarm/*) full=true; reason="smr-swarm/* branch" ;;
            esac
            if [ "<< pipeline.parameters.full >>" = "true" ]; then
              full=true; reason="pipeline parameter full=true"
            fi

            present() { if [ -n "${!1:-}" ]; then echo present; else echo absent; fi; }
            linux=false; windows=false
            if [ "${full}" = true ]; then
              [ -z "${E2E_RUNNER_TOKEN_LINUX:-}" ] || linux=true
              [ -z "${E2E_RUNNER_TOKEN_WINDOWS:-}" ] || windows=true
            fi

            echo "full-suite:  ${full} (${reason})"
            echo "e2e-linux:   ${linux} (E2E_RUNNER_TOKEN_LINUX $(present E2E_RUNNER_TOKEN_LINUX))"
            echo "e2e-windows: ${windows} (E2E_RUNNER_TOKEN_WINDOWS $(present E2E_RUNNER_TOKEN_WINDOWS))"
            if [ "${full}" = true ] && [ "${linux}${windows}" != truetrue ]; then
              echo "An e2e workflow is skipped because its token is absent. The scalable-machine-runner-e2e"
              echo "context is missing, restricted for this pipeline, or lacks the secret. See docs/ci.md."
            fi

            # release implies full-suite, e2e-linux and e2e-windows (both tokens are required,
            # and a token only counts on a full-suite pipeline), so those stay true here.
            release=false
            if [ "${CIRCLE_BRANCH:-}" = main ] && [ "${linux}${windows}" = truetrue ]; then
              release=true
              echo "release:     true (main with both e2e tokens: the release job waits for every other job)"
            else
              echo "release:     false (only main with both e2e tokens releases)"
            fi

            jq -n --argjson full "${full}" --argjson linux "${linux}" --argjson windows "${windows}" \
              --argjson release "${release}" \
              '{"full-suite": $full, "e2e-linux": $linux, "e2e-windows": $windows, "release": $release}' > /tmp/setup/parameters.json
            cat /tmp/setup/parameters.json
      - run:
          name: Continue the pipeline with .circleci/continue.yml
          command: |
            # Same API call as the circleci/continuation orb, without printing the
            # request body (it carries the continuation key).
            : "${CIRCLE_CONTINUATION_KEY:?setup workflows are not enabled for this project}"
            jq -n \
              --arg key "${CIRCLE_CONTINUATION_KEY}" \
              --rawfile config .circleci/continue.yml \
              --slurpfile params /tmp/setup/parameters.json \
              '{"continuation-key": $key, "configuration": $config, "parameters": $params[0]}' \
              > /tmp/setup/continue.json
            code=$(curl -sS --retry 5 --retry-connrefused -o /tmp/setup/response.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data @/tmp/setup/continue.json https://circleci.com/api/v2/pipeline/continue)
            rm -f /tmp/setup/continue.json
            cat /tmp/setup/response.json; echo
            [ "${code}" = 200 ]

workflows:
  setup:
    jobs:
      - setup:
          context: [scalable-machine-runner-e2e]
